name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1"

permissions:
  contents: read

jobs:
  dataset:
    if: github.event_name != 'schedule'
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -p test_dataset.py -v
      - run: python -m unittest discover -s tests -p test_setup.py -v

  cpu:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install torch==2.13.0 torchvision==0.28.0 --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -r minecraft_biomas/requirements.txt -r requirements-dev.txt
      - name: Unit and regression tests with coverage
        run: |
          python -m pytest tests -q -m "not performance" \
            --cov=minecraft_biomas --cov=scripts \
            --cov-report=term-missing --cov-report=xml:coverage.xml \
            --cov-fail-under=50
      - name: CPU performance budgets
        run: python -m pytest tests/test_performance.py -q -m performance
      - name: Save coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml
          if-no-files-found: ignore

  quality:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install "ruff>=0.8,<1"
      - name: Critical correctness checks (entire repository)
        run: ruff check --output-format github .
      - name: Broader lint rules for new regression tests
        run: ruff check --output-format github --select E4,E7,E9,F tests/test_ci_regressions.py tests/test_performance.py

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install torch==2.13.0 torchvision==0.28.0 --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -r minecraft_biomas/requirements.txt -r requirements-dev.txt
      - run: python -m pip install --upgrade 'setuptools>=84.1.0'
      - run: python -m pip install pip-audit
      - name: Audit installed Python dependencies including PyTorch
        run: python -m pip_audit --local
      - name: Audit upstream PyPI releases for PyTorch CPU wheels
        run: |
          python - <<'PY'
          from importlib.metadata import version
          from pathlib import Path
          packages = ('torch', 'torchvision')
          pins = [f'{name}=={version(name).split("+")[0]}' for name in packages]
          Path('torch-upstream-audit.txt').write_text('\n'.join(pins) + '\n', encoding='utf-8')
          print('Checking canonical versions:', ', '.join(pins))
          PY
          python -m pip_audit --requirement torch-upstream-audit.txt --no-deps
