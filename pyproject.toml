[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "performance: generous CPU-only performance smoke tests; runs separately in CI",
]

[tool.ruff]
target-version = "py312"
line-length = 100

# Critical correctness rules for the existing codebase.
# Broader E/F rules also run on the new regression test files in CI.
[tool.ruff.lint]
select = ["E4", "E9", "F63", "F7", "F82"]
